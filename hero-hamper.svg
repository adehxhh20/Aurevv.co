<!-- teddy -->
<g stroke="#172B4D" stroke-width="5" stroke-linejoin="round">
<circle cx="408" cy="410" r="30" fill="#D9A877"/><circle cx="504" cy="410" r="30" fill="#D9A877" opacity="0"/>
<circle cx="372" cy="376" r="22" fill="#D9A877"/><circle cx="444" cy="376" r="22" fill="#D9A877"/>
<circle cx="408" cy="430" r="64" fill="#D9A877"/><ellipse cx="408" cy="448" rx="30" ry="22" fill="#F1D3B0"/>
<circle cx="386" cy="418" r="6" fill="#172B4D" stroke="none"/><circle cx="430" cy="418" r="6" fill="#172B4D" stroke="none"/>
<ellipse cx="408" cy="438" rx="9" ry="6" fill="#172B4D" stroke="none"/>
</g>
<ellipse cx="368" cy="444" rx="11" ry="7" fill="#F7B5C9"/><ellipse cx="448" cy="444" rx="11" ry="7" fill="#F7B5C9"/>
<!-- cookies and chocolate -->
<g stroke="#172B4D" stroke-width="5"><circle cx="300" cy="560" r="44" fill="#E6B77A"/><circle cx="470" cy="566" r="40" fill="#E6B77A"/></g>
<g fill="#5B3A29"><circle cx="286" cy="548" r="6"/><circle cx="312" cy="566" r="6"/><circle cx="296" cy="578" r="5"/><circle cx="458" cy="556" r="6"/><circle cx="480" cy="574" r="6"/></g>
<rect x="370" y="520" width="80" height="56" rx="8" fill="#6B3E2A" stroke="#172B4D" stroke-width="5"/><path d="M370 548h80 M410 520v56" stroke="#4A2A1C" stroke-width="4"/>
<!-- basket -->
<path d="M140 560h520l-40 250c-4 26-26 44-52 44H232c-26 0-48-18-52-44z" fill="url(#bask)" stroke="#172B4D" stroke-width="6" stroke-linejoin="round"/>
<g stroke="#A97F45" stroke-width="5" stroke-linecap="round" fill="none"><path d="M158 620h484 M166 680h468 M174 740h452 M186 796h428"/><path d="M230 562l-12 290 M310 562l-6 290 M400 562v292 M490 562l6 290 M570 562l12 290"/></g>
