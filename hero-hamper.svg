<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="A gift hamper basket filled with a teddy, chocolates, cookies, a card and dried flowers">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6EEDF"/><stop offset="1" stop-color="#EAD9BD"/></linearGradient>
<linearGradient id="bask" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9B27C"/><stop offset="1" stop-color="#C39A60"/></linearGradient>
</defs>
<rect width="800" height="1000" fill="url(#bg)"/>
<rect y="700" width="800" height="300" fill="#E2CDA9"/>
<ellipse cx="400" cy="860" rx="300" ry="30" fill="#172B4D" opacity=".12"/>
<!-- dried flowers -->
<g stroke="#8A6B3F" stroke-width="5" stroke-linecap="round" fill="none">
<path d="M300 520C290 420 280 360 270 300"/><path d="M340 520C340 420 350 340 366 270"/><path d="M470 520C480 430 500 360 530 300"/>
</g>
<g fill="#F7B5C9"><circle cx="270" cy="296" r="22"/><circle cx="252" cy="318" r="16"/><circle cx="290" cy="320" r="16"/></g>
<g fill="#FFFFFF"><circle cx="366" cy="266" r="24"/><circle cx="346" cy="292" r="17"/><circle cx="388" cy="294" r="17"/></g>
<g fill="#FFC93C"><circle cx="270" cy="296" r="8"/><circle cx="366" cy="266" r="9"/></g>
<g fill="#A9D8F5"><circle cx="530" cy="296" r="22"/><circle cx="512" cy="320" r="16"/><circle cx="552" cy="318" r="16"/></g>
<!-- card -->
