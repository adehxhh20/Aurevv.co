<!-- ribbon -->
<g stroke="#172B4D" stroke-width="5" stroke-linejoin="round"><path d="M400 600c-30-44-84-40-84-6s46 30 84 6z" fill="#F7B5C9"/><path d="M400 600c30-44 84-40 84-6s-46 30-84 6z" fill="#F7B5C9"/><circle cx="400" cy="600" r="16" fill="#FFFFFF"/><path d="M388 614l-20 60 M412 614l20 60" fill="none" stroke-linecap="round"/></g>
</svg>
