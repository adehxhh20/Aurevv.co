function render(restoreKey) {
app.innerHTML = view();
if (restoreKey) {
var el = app.querySelector('[data-k="' + restoreKey + '"]');
if (el) el.focus({ preventScroll: true });
}
}

app.addEventListener("click", function (e) {
var fromKeyboard = e.detail === 0;
var top = e.target.closest("[data-top]");
if (top) {
e.preventDefault();
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
return;
}
var tab = e.target.closest("[data-hid]");
if (tab) {
state = { hid: tab.getAttribute("data-hid"), sel: -1 };
render(fromKeyboard ? tab.getAttribute("data-k") : null);
return;
}
var item = e.target.closest("[data-i]");
if (item) {
var i = parseInt(item.getAttribute("data-i"), 10);
state.sel = state.sel === i ? -1 : i;
render(fromKeyboard ? item.getAttribute("data-k") : null);
}
});

render();
})();
